  async function deleteStudentFromSupabase(student) {
      const id = student.id;
  const pendingSave = studentSaveQueues.get(id);

  if (pendingSave) {
    await pendingSave;
  }
  const { data, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !data.user) {
    throw new Error("Bitte zuerst anmelden.");
  }

  const { error } = await supabaseClient
    .from("students")
    .delete()
    .eq("id", student.id);

  if (error) throw error;
}
 const studentSaveQueues = new Map();
  const deletingStudentIds = new Set();
function saveStudentToSupabase(student) {
  const id = student.id;
    if (deletingStudentIds.has(id)) {
    return Promise.reject(
      new Error("Dieser Schüler wird gerade gelöscht.")
    );
  }

  const snapshot = {
    id: id,
    name: student.name,
    flights: student.flights,
    glider: student.glider || "",
    weight: student.weight ?? null,
    material: [...student.material],
    maneuvers: [...student.maneuvers],
    notes: student.notes || ""
  };

  const previous = studentSaveQueues.get(id) || Promise.resolve();

  const current = previous.catch(() => {}).then(async () => {
    const { data, error: authError } =
      await supabaseClient.auth.getUser();

    if (authError || !data.user) {
      throw new Error("Bitte zuerst anmelden.");
    }

    const { error } = await supabaseClient
      .from("students")
      .upsert(snapshot, { onConflict: "id" });

    if (error) throw error;
  });

  studentSaveQueues.set(id, current);

  current.finally(() => {
    if (studentSaveQueues.get(id) === current) {
      studentSaveQueues.delete(id);
    }
  }).catch(() => {});

  return current;
}

  $("editor").hidden = true;
};

$("studentForm").onsubmit = event => {
  event.preventDefault();

  const name = $("name").value.trim();
  const glider = $("glider").value.trim();
  const weight = $("weight").value === "" ? null : Number($("weight").value);
  const flights = Number($("flights").value);

 if (!name || !Number.isInteger(flights) ||
    flights < 0 || flights > 99999 ||
    (weight !== null &&
      (!Number.isFinite(weight) || weight <= 0 || weight > 300))) {
  alert("Bitte gültige Angaben eingeben.");
  return;
}
let student;
  if (editingId === null) {
   student = {
      id: crypto.randomUUID(),
      name,
      flights,
      glider,
      weight,
      material: [false, false, false, false],
      maneuvers: Array(maneuvers.length).fill("red"),
      notes: ""
    };

    students.push(student);
    selectedId = student.id;
  } else {
student = students.find(s => s.id === editingId);
    if (!student) return;

    student.name = name;
    student.flights = flights;
    student.glider = glider;
    student.weight = weight;
    selectedId = student.id;
  }

  save(student);
  renderStudents();
  $("editor").hidden = true;
  showStudent(selectedId);
};

function showStudent(id) {

  const student = students.find(s => s.id === id);
  if (!student) return;

const details = $("details");
$("studentOverview").open = true;
details.hidden = false;
  
requestAnimationFrame(() => {
  details.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

details.replaceChildren();

const closeButton = document.createElement("button");
closeButton.textContent = "✕ Schliessen";
closeButton.style.background = "#64748b";

closeButton.onclick = () => {
  details.hidden = true;
  details.replaceChildren();
  selectedId = null;

  // Zurück zum ursprünglichen Schulungstag
  if (window.lastTrainingDayId) {
    const dayBox = [...document.querySelectorAll(
      "#trainingDays details[data-day-id]"
    )].find(
      element => element.dataset.dayId === window.lastTrainingDayId
    );

    if (dayBox) {
      dayBox.open = true;

  const registrations = [...dayBox.querySelectorAll(
  ".training-section"
)].find(section =>
  section.querySelector("h4")?.textContent.includes("Anmeldungen")
);

      requestAnimationFrame(() => {
        (registrations || dayBox).scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });
    }

    window.lastTrainingDayId = null;
  }
};

details.appendChild(closeButton);
addText(details, "h2", student.name);
const gliderInfo = addText(
  details,
  "p",
  "🪂 Schirm: " + (student.glider || "Nicht eingetragen")
);

gliderInfo.innerHTML =
  "🪂 <strong>Schirm:</strong> " +
  (student.glider || "Nicht eingetragen");
 const weightInfo = addText(
  details,
  "p",
  "⚖️ Gewicht: " + (student.weight == null ? "Nicht eingetragen" : student.weight + " kg")
);

weightInfo.innerHTML =
  "⚖️ <strong>Gewicht:</strong> " +
  (student.weight == null ? "Nicht eingetragen" : student.weight + " kg");
const flightRow = document.createElement("div");
flightRow.style.cssText =

const flightCount = addText(

);

flightCount.style.cssText =
  "font-weight:bold; margin-right:8px;";

details.appendChild(flightRow);

const plusButton = document.createElement("button");
plusButton.textContent = "➕ 1 Flug";

plusButton.onclick = () => {
  student.flights += 1;
  flightCount.textContent = student.flights + " Flüge";
save(student);
  renderStudents();
};

flightRow.appendChild(plusButton);
const minusButton = document.createElement("button");
minusButton.textContent = "➖ 1 Flug";
minusButton.style.background = "#64748b";

minusButton.onclick = () => {
  if (student.flights <= 0) return;

  student.flights -= 1;
  flightCount.textContent = student.flights + " Flüge";
  save(student);
  renderStudents();
};

flightRow.insertBefore(minusButton, plusButton);
  const editButton = document.createElement("button");
  editButton.textContent = "✏️ Schüler bearbeiten";
  editButton.onclick = () => openEditor(id);
  details.appendChild(editButton);
  const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️ Schüler löschen";
deleteButton.style.background = "#dc2626";

deleteButton.onclick = async () => {
  const confirmed = confirm(
    "Möchtest du " + student.name +
    " wirklich löschen?\n\n" +
    "Alle Manöver, Bemerkungen und Materialangaben " +
    "dieses Schülers werden ebenfalls gelöscht."
  );

  if (!confirmed) return;
  if (deleteButton.disabled) return;
deleteButton.disabled = true;
deletingStudentIds.add(student.id);
  try {
    await deleteStudentFromSupabase(student);
 } catch (error) {
  alert("Schüler konnte nicht aus Supabase gelöscht werden: " + error.message);
    deleteButton.disabled = false;
  return;
} finally {
  deletingStudentIds.delete(student.id);
}
  students = students.filter(s => s.id !== student.id);
  save();
  renderStudents();

  details.replaceChildren();
  details.hidden = true;
  selectedId = null;
};

details.appendChild(deleteButton);

// MANÖVER
  const maneuverDivider = document.createElement("hr");
  maneuverDivider.style.cssText =
    "border:0; border-top:1px solid #e2e8f0; margin:24px 0;";
  details.appendChild(maneuverDivider);

  addText(details, "h3", "🪂 Manöver");

  const progress = document.createElement("div");
  progress.className = "progress";

  const bar = document.createElement("div");
  bar.className = "bar";
  progress.appendChild(bar);
  details.appendChild(progress);

  const countText = addText(details, "p", "");

  function updateProgress() {
    const done = student.maneuvers.filter(
      status => status === "green"
    ).length;

    bar.style.width = (done / maneuvers.length * 100) + "%";
    countText.textContent =
      done + " von " + maneuvers.length + " Manövern beherrscht";
  }

  maneuvers.forEach((maneuver, index) => {
    const box = document.createElement("div");
    box.className = "maneuver";

    addText(box, "strong", maneuver);

    const controls = document.createElement("div");
    controls.className = "status";

    const options = [
      ["red", "🔴 Offen"],
      ["yellow", "🟡 In Übung"],
      ["green", "🟢 Beherrscht"]
    ];

    function drawButtons() {
      controls.replaceChildren();

      options.forEach(([value, label]) => {
        const button = document.createElement("button");
        button.textContent = label;
        button.className = value;

        if (student.maneuvers[index] === value) {
          button.classList.add("active");
        }

        button.onclick = () => {
          student.maneuvers[index] = value;
          save(student);
          drawButtons();
          updateProgress();
        };

        controls.appendChild(button);
      });
    }

    drawButtons();
    box.appendChild(controls);
    details.appendChild(box);
  });

  updateProgress();

  // BEMERKUNGEN
  addText(details, "h3", "📝 Bemerkungen");

  const notes = document.createElement("textarea");
  notes.rows = 5;
  notes.placeholder = "Hinweise für den nächsten Flug ...";
  notes.value = student.notes || "";

 let notesSaveTimer;

notes.oninput = () => {
  student.notes = notes.value;
save();
  clearTimeout(notesSaveTimer);

  notesSaveTimer = setTimeout(() => {
    save(student);
  }, 800);
};

  details.appendChild(notes);

  addText(details, "p",
  "Bemerkungen werden automatisch in Supabase gespeichert."
  ).className = "small";

// MATERIAL
const materialSection = document.createElement("details");
details.appendChild(materialSection);

const materialSummary = document.createElement("summary");
materialSummary.textContent = "🎒 Materialverwaltung";
materialSummary.style.fontWeight = "bold";
materialSummary.style.cursor = "pointer";
materialSection.appendChild(materialSummary);
  
 addText(materialSection, "p",
  "Häkchen setzen, wenn eigenes Material vorhanden ist:");

  const missing = document.createElement("div");
  missing.className = "notice";

  function updateMissing() {
    const needed = materials.filter(
      (_, index) => !student.material[index]
    );

missing.textContent = needed.length
      ? "🎒 Flugschule muss mitbringen: " + needed.join(", ")
      : "✅ Alles eigene Material vorhanden!";

materialSummary.textContent = needed.length > 0
  ? "🎒 Flugschule muss mitbringen: " + needed.join(", ")
  : "✅ Alles eigene Material vorhanden!";
    
  }

  materials.forEach((material, index) => {
    const label = document.createElement("label");
    label.className = "material";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = student.material[index];

    checkbox.onchange = () => {
      student.material[index] = checkbox.checked;
      save(student);
      updateMissing();
      renderStudents();
      renderTrainingDays();
    };

    label.appendChild(checkbox);
    addText(label, "span", material + " – eigenes Material");
    materialSection.appendChild(label);
  });

  updateMissing();
  
const bottomCloseButton = closeButton.cloneNode(true);
bottomCloseButton.onclick = closeButton.onclick;
details.appendChild(bottomCloseButton);
  details.hidden = false;
}
// SCHULUNGSTAGE SPEICHERN
let trainingDays = [];

function renderTrainingDays() {
    // Vergangene Schulungstage nur ausblenden, nicht löschen
  const today = new Date();
  const todayString =
    today.getFullYear() + "-" +
    String(today.getMonth() + 1).padStart(2, "0") + "-" +
    String(today.getDate()).padStart(2, "0");

const visibleTrainingDays = trainingDays.filter(
  day => day.date >= todayString
);
  
const container = $("trainingDays");

// Merken, welche Schulungstage geöffnet sind
const openTrainingDays = new Set(
  [...container.querySelectorAll("details[open]")]
    .map(element => element.dataset.dayId)
);

container.replaceChildren();

const sortedDays = [...visibleTrainingDays].sort(
    (a, b) => a.date.localeCompare(b.date)
  );

 sortedDays.forEach(day => {
  const box = document.createElement("details");
  box.className = "maneuver";

  // Geöffneten Zustand wiederherstellen
  box.dataset.dayId = String(day.id);
  box.open = openTrainingDays.has(String(day.id));

    const dateText = new Date(
      day.date + "T12:00:00"
    ).toLocaleDateString("de-CH", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });

const summary = document.createElement("summary");
summary.textContent =
  "📅 " + dateText + " · 👨‍🎓 " +
  day.participants.length + " angemeldet";
summary.style.fontWeight = "bold";
summary.style.cursor = "pointer";
box.appendChild(summary);
const deleteDayButton = document.createElement("button");
deleteDayButton.textContent = "🗑️ Schulungstag löschen";
deleteDayButton.style.background = "#dc2626";

deleteDayButton.onclick = async () => {
  const confirmed = confirm(
    "Möchtest du den Schulungstag vom " +
    dateText +
    " wirklich löschen?"
  );

  if (!confirmed) return;

  try {
    const { error } = await supabaseClient
      .from("training_days")
      .delete()
      .eq("id", day.id);

    if (error) throw error;

    trainingDays = trainingDays.filter(
      item => item.id !== day.id
    );

    renderTrainingDays();
  } catch (error) {
    console.error("Schulungstag konnte nicht gelöscht werden:", error);
    alert("Schulungstag konnte nicht aus Supabase gelöscht werden.");
  }
};

box.appendChild(deleteDayButton);

const attending = students.filter(
  student => day.participants.includes(student.id)
);
    
// Nur angemeldete Schüler anzeigen
const registrationsSection = document.createElement("div");
registrationsSection.className = "training-section";
box.appendChild(registrationsSection);

addText(
  registrationsSection,
  "h4",
  "👨‍🎓 Anmeldungen (" + attending.length + " Schüler)"
);

attending.forEach(student => {
  const row = document.createElement("div");
  row.className = "material";

  const info = document.createElement("div");
info.style.flex = "1";

const nameButton = document.createElement("button");
nameButton.textContent = "👨‍🎓 " + student.name;
nameButton.onclick = () => {
  showStudent(student.id);
  window.lastTrainingDayId = String(day.id);
};
info.appendChild(nameButton);

const infoLine = document.createElement("div");
infoLine.style.fontSize = "13px";
infoLine.style.marginTop = "5px";

infoLine.textContent =
  "🪂 " + student.flights + " Flüge · " +
  "⚖️ " + (student.weight == null
    ? "Gewicht fehlt"
    : student.weight + " kg");

info.appendChild(infoLine);

const missingForStudent = materials.filter(
  (_, index) => !student.material[index]
);

const materialLine = document.createElement("div");
materialLine.style.fontSize = "13px";
materialLine.style.marginTop = "4px";

materialLine.textContent = missingForStudent.length === 0

info.appendChild(materialLine);
row.appendChild(info);

row.classList.add("registration-row");

// Fluganzahl für diesen Schüler eingeben

flightInput.type = "number";
flightInput.min = "0";
flightInput.step = "1";
flightInput.value = "0";
flightInput.placeholder = "";
flightInput.title = "Neue Flüge für " + student.name;
flightInput.style.width = "65px";
flightInput.classList.add("registration-flight-input");
flightInput.style.flex = "0 0 65px";
flightInput.style.minWidth = "0";

const flightControls = document.createElement("div");
flightControls.classList.add("registration-flight-controls");
flightControls.style.cssText =
flightControls.style.cssText =

flightControls.appendChild(flightInput);
row.appendChild(flightControls);

const saveFlightButton = document.createElement("button");
saveFlightButton.textContent = "✓ Flüge speichern";
saveFlightButton.classList.add("registration-save-button");
saveFlightButton.style.background = "#16a34a";
saveFlightButton.style.whiteSpace = "nowrap";
saveFlightButton.style.width = "auto";
saveFlightButton.style.flex = "0 0 auto";
saveFlightButton.style.padding = "12px 8px";
saveFlightButton.style.margin = "0";
flightControls.appendChild(saveFlightButton);

savedMessage.textContent = "✅ Gespeichert";
savedMessage.style.color = "#16a34a";
savedMessage.hidden = true;
flightControls.appendChild(savedMessage);
saveFlightButton.onclick = async () => {
  const additionalFlights = Number(flightInput.value);

  if (
  !Number.isInteger(additionalFlights) ||
  additionalFlights < 0
) {
  alert("Bitte eine gültige Flugzahl ab 0 eingeben.");
  return;
}

    if (saveFlightButton.disabled) {
    return;
  }
  
  saveFlightButton.disabled = true;
  saveFlightButton.textContent = "Speichert ...";

  try {
    const updatedStudent = {
      ...student,
      flights: Number(student.flights || 0) + additionalFlights
    };

    await saveStudentToSupabase(updatedStudent);

    student.flights = updatedStudent.flights;
    renderStudents();
    
   infoLine.textContent =
  "🪂 " + student.flights + " Flüge · " +
  "⚖️ " + (student.weight == null
    ? "Gewicht fehlt"
    : student.weight + " kg");
    
    flightInput.disabled = true;
    saveFlightButton.hidden = true;
    savedMessage.hidden = false;
  } catch (error) {
    console.error("Flüge konnten nicht gespeichert werden:", error);
    alert("Flüge konnten nicht gespeichert werden.");
    saveFlightButton.disabled = false;
    saveFlightButton.textContent = "Flüge speichern";
  }
};

  const removeButton = document.createElement("button");
  removeButton.textContent = "✕";
  removeButton.style.background = "#dc2626";
  removeButton.classList.add("registration-remove-button");
  removeButton.title = "Vom Schulungstag abmelden";

 removeButton.onclick = async () => {
    const confirmed = confirm(
    "Möchtest du " + student.name +
    " wirklich vom Schulungstag abmelden?"
  );

  if (!confirmed) {
    return;
  }
  const updatedDay = {
    ...day,
    participants: day.participants.filter(
      id => id !== student.id
    )
  };

  try {
    await saveTrainingDayToSupabase(updatedDay);
    day.participants = updatedDay.participants;
    renderTrainingDays();
  } catch (error) {
    console.error("Teilnehmer konnte nicht abgemeldet werden:", error);
    alert("Änderung konnte nicht in Supabase gespeichert werden.");
  }
};

  row.appendChild(removeButton);
  registrationsSection.appendChild(row);
});

// Weitere Schüler nur auf Wunsch anzeigen
// MATERIAL FÜR DIESEN SCHULUNGSTAG
const packingSection = document.createElement("div");
packingSection.className = "training-section";
box.insertBefore(packingSection, registrationsSection.nextSibling);

const materialTitle = addText(
  packingSection, "h4", "🎒 Packliste"
);

const neededMaterials = materials.map((material, index) => {
  const count = attending.filter(student =>
    !student.material[index]
  ).length;

  return { material, count };
});

const missingMaterials = neededMaterials.filter(
  item => item.count > 0
);

if (attending.length === 0) {
  addText(
    packingSection, "p", "Noch keine Teilnehmer angemeldet."
  );
} else if (missingMaterials.length === 0) {
  addText(
    packingSection, "p", "✅ Alle Teilnehmer haben eigenes Material."
  );
} else {
  missingMaterials.forEach(item => {
    addText(
      packingSection,
      "p",
      materialSymbols[materials.indexOf(item.material)] +
      " " + item.material + ": " +
      item.count
    );
  });
}
const addButton = document.createElement("button");
addButton.textContent = "+ Teilnehmer hinzufügen";
registrationsSection.appendChild(addButton);

const selection = document.createElement("div");
selection.hidden = true;
registrationsSection.appendChild(selection);

addButton.onclick = () => {
  selection.hidden = !selection.hidden;
  addButton.textContent = selection.hidden
    ? "+ Teilnehmer hinzufügen"
    : "Auswahl schliessen";
};

// Hier sammeln wir die ausgewählten Schüler
const selectedParticipants = new Set();

students
  .filter(student => !day.participants.includes(student.id))
  .forEach(student => {
    const button = document.createElement("label");
    button.className = "student";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    button.appendChild(checkbox);
    button.appendChild(
      document.createTextNode(" " + student.name)
    );

 checkbox.onchange = () => {
  if (checkbox.checked) {
    selectedParticipants.add(student.id);
  } else {
    selectedParticipants.delete(student.id);
  }
};

    selection.appendChild(button);
  });

   const saveParticipantsButton = document.createElement("button");
saveParticipantsButton.textContent = "✅ Ausgewählte Teilnehmer anmelden";

saveParticipantsButton.onclick = async () => {
  if (selectedParticipants.size === 0) {
    alert("Bitte zuerst mindestens einen Schüler auswählen.");
    return;
  }

  const updatedDay = {
    ...day,
    participants: [
      ...new Set([...day.participants, ...selectedParticipants])
    ]
  };

  try {
    await saveTrainingDayToSupabase(updatedDay);
    day.participants = updatedDay.participants;
    renderTrainingDays();
  } catch (error) {
    console.error("Teilnehmer konnten nicht angemeldet werden:", error);
    alert("Änderung konnte nicht in Supabase gespeichert werden.");
  }
};

selection.appendChild(saveParticipantsButton);

    container.appendChild(box);
  });
}

$("trainingDate").value =
  new Date().toLocaleDateString("en-CA");

$("createTrainingDay").onclick = async () => {
  const date = $("trainingDate").value;

  if (!date) {
    alert("Bitte zuerst ein Datum auswählen.");
    return;
  }

  if (trainingDays.some(day => day.date === date)) {
    alert("Für dieses Datum gibt es bereits einen Schulungstag.");
    return;
  }

 const newDay = {
  id: crypto.randomUUID(),
  date: date,
  participants: []
};

try {
  await saveTrainingDayToSupabase(newDay);
  trainingDays.push(newDay);
  renderTrainingDays();
} catch (error) {
  console.error("Schulungstag konnte nicht gespeichert werden:", error);
  alert("Schulungstag konnte nicht in Supabase gespeichert werden.");
}
};
$("studentOverview").addEventListener("toggle", () => {
  if (!$("studentOverview").open) {
    $("details").hidden = true;
    $("details").replaceChildren();
    selectedId = null;
  }
});
renderTrainingDays();
renderStudents();
