      "Fehler bei der Anmeldung: " + error.message;

      "Bitte lege jetzt dein neues Passwort fest.";

  async function loadStudentsFromSupabase() {
  const { data, error } = await supabaseClient
    .from("students")
    .select("*")
    .order("name");

  if (error) {
    throw error;
  }

  return data;
}
  async function deleteStudentFromSupabase(student) {
  const { data, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !data.user) {
    throw new Error("Bitte zuerst anmelden.");
  }

  const { error } = await supabaseClient
    .from("students")
    .delete()
    .eq("id", getSupabaseStudentId(student.id));

  if (error) throw error;
}
  async function saveStudentToSupabase(student) {
  const { data, error: authError } =
    await supabaseClient.auth.getUser();

  if (authError || !data.user) {
    throw new Error("Bitte zuerst anmelden.");
  }

  const { error } = await supabaseClient
    .from("students")
    .upsert({
      id: getSupabaseStudentId(student.id),
      name: student.name,
      flights: student.flights,
      glider: student.glider || "",
      material: student.material || [false, false, false, false],
      maneuvers: student.maneuvers || [],
      notes: student.notes || ""
    }, { onConflict: "id" });

  if (error) throw error;
}
  function getSupabaseStudentId(id) {
  const demoIds = {
    "demo-1": "00000000-0000-4000-8000-000000000001",
    "demo-2": "00000000-0000-4000-8000-000000000002",
    "demo-3": "00000000-0000-4000-8000-000000000003"
  };

  return demoIds[id] || id;
}

id: getSupabaseStudentId(student.id),

      flights < 0 || flights > 99999) {
    alert("Bitte gültige Angaben eingeben.");
    return;
  }

    const student = {

name,
flights,
glider,

  );

  if (!confirmed) return;

  trainingDays = trainingDays.filter(
    item => item.date !== day.date
  );

  saveTrainingDays();
  renderTrainingDays();
};

box.appendChild(deleteDayButton);
    
const info = addText(
  box, "p", "Teilnehmer auswählen:"
);
info.className = "small";


const attending = students.filter(
  student => day.participants.includes(student.id)
);

addText(
  box,
  "p",
  "👨‍🎓 " + attending.length + " Schüler angemeldet"
);

// Nur angemeldete Schüler anzeigen
attending.forEach(student => {
  const row = document.createElement("div");
  row.className = "material";

  const nameButton = document.createElement("button");
  nameButton.textContent = "👨‍🎓 " + student.name;
  nameButton.onclick = () => showStudent(student.id);
  row.appendChild(nameButton);

  const removeButton = document.createElement("button");
  removeButton.textContent = "✕";
  removeButton.style.background = "#dc2626";
  removeButton.title = "Vom Schulungstag abmelden";

  removeButton.onclick = () => {
    day.participants = day.participants.filter(
      id => id !== student.id
    );
    saveTrainingDays();
    renderTrainingDays();
  };

  row.appendChild(removeButton);
  box.appendChild(row);
});

// Weitere Schüler nur auf Wunsch anzeigen
// MATERIAL FÜR DIESEN SCHULUNGSTAG
const materialTitle = addText(
  box, "h4", "🎒 Material für diesen Schulungstag"
);

const neededMaterials = materials.map((material, index) => {
  const count = attending.filter(student =>
    !student.material[index]
  ).length;

  return { material, count };
});

const missingMaterials = neededMaterials.filter(
  item => item.count > 0
);

if (attending.length === 0) {
  addText(
    box, "p", "Noch keine Teilnehmer angemeldet."
  );
} else if (missingMaterials.length === 0) {
  addText(
    box, "p", "✅ Alle Teilnehmer haben eigenes Material."
  );
} else {
  missingMaterials.forEach(item => {
    addText(
      box,
      "p",
materialSymbols[materials.indexOf(item.material)] +
" " + item.material + ": " +
item.count
    );
  });
}
const addButton = document.createElement("button");
addButton.textContent = "+ Teilnehmer hinzufügen";
box.appendChild(addButton);

const selection = document.createElement("div");
selection.hidden = true;
box.appendChild(selection);

addButton.onclick = () => {
  selection.hidden = !selection.hidden;
  addButton.textContent = selection.hidden
    ? "+ Teilnehmer hinzufügen"
    : "Auswahl schliessen";
};

students
  .filter(student => !day.participants.includes(student.id))
  .forEach(student => {
    const button = document.createElement("button");
    button.className = "student";
    button.textContent = "+ " + student.name;

    button.onclick = () => {
      day.participants.push(student.id);
      saveTrainingDays();
      renderTrainingDays();
    };

    selection.appendChild(button);
  });



    container.appendChild(box);
  });
}

$("trainingDate").value =
  new Date().toLocaleDateString("en-CA");

$("createTrainingDay").onclick = () => {
  const date = $("trainingDate").value;

  if (!date) {
    alert("Bitte zuerst ein Datum auswählen.");
    return;
  }

  if (trainingDays.some(day => day.date === date)) {
    alert("Für dieses Datum gibt es bereits einen Schulungstag.");
    return;
  }

  trainingDays.push({
    id: crypto.randomUUID(),
    date: date,
    participants: []
  });

  saveTrainingDays();
  renderTrainingDays();
};
$("studentOverview").addEventListener("toggle", () => {
  if (!$("studentOverview").open) {
    $("details").hidden = true;
    $("details").replaceChildren();
    selectedId = null;
  }
});
renderTrainingDays();
renderStudents();
</script>
</body>
</html>
