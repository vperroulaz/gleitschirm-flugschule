<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gleitschirm Flugschule</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef4f8;color:#17324b;font-family:Arial,sans-serif}
header{background:#176c9a;color:white;padding:24px;text-align:center}
main{max-width:850px;margin:24px auto;padding:16px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 3px 12px #0001}
.student{width:100%;display:block;text-align:left;background:#f2f7fb;color:#17324b;border:1px solid #dce8f0;padding:15px;border-radius:10px;margin:10px 0;cursor:pointer}
.student:hover{background:#e2f0fa}
.progress{height:9px;background:#e4e9ed;border-radius:9px;overflow:hidden}
.bar{height:100%;background:#28a476}
li{margin:12px 0}
</style>
</head>
<body>
<header><h1>🪂 Gleitschirm Flugschule</h1><p>Schülerverwaltung</p></header>
<main>
<section class="card">
<h2>👨‍🎓 Flugschüler</h2>
<div id="students"></div>
</section>
<section class="card" id="details" hidden></section>
</main>
<script>
const students=[
{name:"Lena Müller",level:"Grundausbildung",flights:8,material:false,maneuvers:["Startvorbereitung","Starttechnik","Geradeausflug"]},
{name:"Marco Steiner",level:"Höhenflüge",flights:24,material:true,maneuvers:["Startvorbereitung","Starttechnik","Geradeausflug","Kurvenflug","Landeanflug","Ziellandung"]},
{name:"Sofia Weber",level:"Grundausbildung",flights:13,material:false,maneuvers:["Startvorbereitung","Starttechnik","Geradeausflug","Kurvenflug"]}
];
const allManeuvers=["Startvorbereitung","Starttechnik","Geradeausflug","Kurvenflug","Acht fliegen","Ohren anlegen","Landeanflug","Ziellandung"];
const list=document.getElementById("students");
students.forEach((s,i)=>{
const b=document.createElement("button");
b.className="student";
b.textContent=s.name+" · "+s.level+" · "+s.flights+" Flüge";
b.onclick=()=>showStudent(i);
list.appendChild(b);
});
function showStudent(i){
const s=students[i],d=document.getElementById("details");
d.replaceChildren();
const title=document.createElement("h2");
title.textContent=s.name;
d.appendChild(title);
const info=document.createElement("p");
info.textContent=s.level+" · "+s.flights+" Flüge";
d.appendChild(info);
const status=document.createElement("p");
status.textContent=s.material?"✅ Eigenes Material vorhanden":"🎒 Schulmaterial mitbringen";
d.appendChild(status);
const heading=document.createElement("h3");
heading.textContent="Ausbildungsstand";
d.appendChild(heading);
const progress=document.createElement("div");
progress.className="progress";
const bar=document.createElement("div");
bar.className="bar";
bar.style.width=(s.maneuvers.length/allManeuvers.length*100)+"%";
progress.appendChild(bar);
d.appendChild(progress);
const ul=document.createElement("ul");
allManeuvers.forEach(m=>{
const li=document.createElement("li");
li.textContent=(s.maneuvers.includes(m)?"✅ ":"⬜ ")+m;
ul.appendChild(li);
});
d.appendChild(ul);
d.hidden=false;
}
</script>
</body>
</html>
