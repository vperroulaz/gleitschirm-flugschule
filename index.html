
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gleitschirm Flugschule</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef4f8;
  color: #17324b;
}
header {
  background: #176c9a;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  max-width: 850px;
  margin: 24px auto;
  padding: 16px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px #0001;
}
button {
  background: #176c9a;
  color: white;
  border: none;
  padding: 11px 15px;
  border-radius: 8px;
  cursor: pointer;
  margin: 4px;
}
.student {
  display: block;
  width: 100%;
  text-align: left;
  background: #f2f7fb;
  color: #17324b;
  border: 1px solid #dce8f0;
  padding: 15px;
  margin: 8px 0;
}
input, textarea {
  padding: 10px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  width: 100%;
  font: inherit;
}
input[type="checkbox"] {
  width: 20px;
  height: 20px;
}
label {
  display: block;
  margin: 12px 0;
}
.material {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
}
.maneuver {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}
.status {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.status button {
  flex: 1;
  min-width: 80px;
  background: #e5e7eb;
  color: #333;
  font-size: 13px;
  margin: 0;
}
.status .red.active {
  background: #dc2626;
  color: white;
}
.status .yellow.active {
  background: #eab308;
  color: #222;
}
.status .green.active {
  background: #16a34a;
  color: white;
}
.notice {
  background: #fff3db;
  padding: 14px;
  border-radius: 10px;
  margin-top: 15px;
}
.progress {
  height: 10px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
}
.bar {
  height: 100%;
  background: #16a34a;
}
.small {
  color: #64748b;
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <h1>🪂 Gleitschirm Flugschule</h1>
  <p>Schülerverwaltung</p>
</header>

<main>
  <section class="card">
    <h2>👨‍🎓 Flugschüler</h2>
    <button id="addBtn">+ Neuer Schüler</button>
    <div id="students"></div>
  </section>

  <section class="card" id="editor" hidden>
    <h2 id="editorTitle">Schüler hinzufügen</h2>
    <form id="studentForm">
      <label>
        Name
        <input id="name" required maxlength="100">
      </label>
      <label>
        Anzahl Flüge
        <input id="flights" type="number"
               min="0" max="99999" value="0" required>
      </label>
      <button type="submit">Speichern</button>
      <button type="button" id="cancelBtn">
        Abbrechen
      </button>
    </form>
  </section>
<section class="card">
  <h2>📅 Schulungstage</h2>
  <label>
    Datum auswählen
    <input id="trainingDate" type="date">
  </label>
  <button id="createTrainingDay">
    + Schulungstag hinzufügen
  </button>
  <div id="trainingDays"></div>
</section>
  <section class="card" id="details" hidden></section>
</main>

<script>
const materials = [
  "Gleitschirm",
  "Gurtzeug",
  "Notschirm",
  "Funkgerät"
];

const maneuvers = [
  "Doppelkreise",
  "Acht",
  "Ohren und beschleunigen",
  "Ohren und Richtungswechsel",
  "Rollen",
  "Nicken",
  "Klapper"
];

const initialStudents = [
  {
    id: "demo-1",
    name: "Lena Müller",
    flights: 8,
    material: [false, false, false, false],
    maneuvers: Array(7).fill("red"),
    notes: ""
  },
  {
    id: "demo-2",
    name: "Marco Steiner",
    flights: 24,
    material: [true, true, true, true],
    maneuvers: [
      "green", "green", "yellow",
      "red", "yellow", "red", "red"
    ],
    notes: ""
  },
  {
    id: "demo-3",
    name: "Sofia Weber",
    flights: 13,
    material: [false, true, false, false],
    maneuvers: Array(7).fill("red"),
    notes: ""
  }
];

const storageKey = "gleitschirm-demo-v2";
let students;

try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  students = Array.isArray(saved) ? saved : initialStudents;
} catch {
  students = initialStudents;
}

let selectedId = null;
let editingId = null;

const $ = id => document.getElementById(id);

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(students));
  } catch {
    alert("Speichern im Browser nicht möglich.");
  }
}

function addText(parent, tag, value) {
  const element = document.createElement(tag);
  element.textContent = value;
  parent.appendChild(element);
  return element;
}

function renderStudents() {
  $("students").replaceChildren();

  students.forEach(student => {
    const button = document.createElement("button");
    button.className = "student";
    button.textContent =
      student.name + " · " + student.flights + " Flüge";

    button.onclick = () => showStudent(student.id);
    $("students").appendChild(button);
  });
}

function openEditor(id = null) {
  editingId = id;
  const student = students.find(s => s.id === id);

  $("editorTitle").textContent = student
    ? "Schüler bearbeiten"
    : "Neuen Schüler hinzufügen";

  $("name").value = student ? student.name : "";
  $("flights").value = student ? student.flights : 0;

  $("editor").hidden = false;
  $("editor").scrollIntoView({ behavior: "smooth" });
}

$("addBtn").onclick = () => openEditor();

$("cancelBtn").onclick = () => {
  $("editor").hidden = true;
};

$("studentForm").onsubmit = event => {
  event.preventDefault();

  const name = $("name").value.trim();
  const flights = Number($("flights").value);

  if (!name || !Number.isInteger(flights) ||
      flights < 0 || flights > 99999) {
    alert("Bitte gültige Angaben eingeben.");
    return;
  }

  if (editingId === null) {
    const student = {
      id: crypto.randomUUID(),
      name,
      flights,
      material: [false, false, false, false],
      maneuvers: Array(7).fill("red"),
      notes: ""
    };

    students.push(student);
    selectedId = student.id;
  } else {
    const student = students.find(s => s.id === editingId);
    if (!student) return;

    student.name = name;
    student.flights = flights;
    selectedId = student.id;
  }

  save();
  renderStudents();
  $("editor").hidden = true;
  showStudent(selectedId);
};

function showStudent(id) {
  selectedId = id;
  const student = students.find(s => s.id === id);
  if (!student) return;

  const details = $("details");
  details.replaceChildren();

  addText(details, "h2", student.name);
  const flightCount = addText(
  details, "p", student.flights + " Flüge"
);

const plusButton = document.createElement("button");
plusButton.textContent = "➕ 1 Flug";

plusButton.onclick = () => {
  student.flights += 1;
  flightCount.textContent = student.flights + " Flüge";
  save();
  renderStudents();
};

details.appendChild(plusButton);

  const editButton = document.createElement("button");
  editButton.textContent = "✏️ Schüler bearbeiten";
  editButton.onclick = () => openEditor(id);
  details.appendChild(editButton);
  const deleteButton = document.createElement("button");
deleteButton.textContent = "🗑️ Schüler löschen";
deleteButton.style.background = "#dc2626";

deleteButton.onclick = () => {
  const confirmed = confirm(
    "Möchtest du " + student.name +
    " wirklich löschen?\n\n" +
    "Alle Manöver, Bemerkungen und Materialangaben " +
    "dieses Schülers werden ebenfalls gelöscht."
  );

  if (!confirmed) return;

  students = students.filter(s => s.id !== student.id);
  save();
  renderStudents();

  details.replaceChildren();
  details.hidden = true;
  selectedId = null;
};

details.appendChild(deleteButton);

  // MANÖVER
  addText(details, "h3", "🪂 Manöver");

  const progress = document.createElement("div");
  progress.className = "progress";

  const bar = document.createElement("div");
  bar.className = "bar";
  progress.appendChild(bar);
  details.appendChild(progress);

  const countText = addText(details, "p", "");

  function updateProgress() {
    const done = student.maneuvers.filter(
      status => status === "green"
    ).length;

    bar.style.width = (done / maneuvers.length * 100) + "%";
    countText.textContent =
      done + " von " + maneuvers.length + " Manövern beherrscht";
  }

  maneuvers.forEach((maneuver, index) => {
    const box = document.createElement("div");
    box.className = "maneuver";

    addText(box, "strong", maneuver);

    const controls = document.createElement("div");
    controls.className = "status";

    const options = [
      ["red", "🔴 Offen"],
      ["yellow", "🟡 In Übung"],
      ["green", "🟢 Beherrscht"]
    ];

    function drawButtons() {
      controls.replaceChildren();

      options.forEach(([value, label]) => {
        const button = document.createElement("button");
        button.textContent = label;
        button.className = value;

        if (student.maneuvers[index] === value) {
          button.classList.add("active");
        }

        button.onclick = () => {
          student.maneuvers[index] = value;
          save();
          drawButtons();
          updateProgress();
        };

        controls.appendChild(button);
      });
    }

    drawButtons();
    box.appendChild(controls);
    details.appendChild(box);
  });

  updateProgress();

  // MATERIAL
  addText(details, "h3", "🎒 Materialverwaltung");
  addText(details, "p",
    "Häkchen setzen, wenn eigenes Material vorhanden ist:");

  const missing = document.createElement("div");
  missing.className = "notice";

  function updateMissing() {
    const needed = materials.filter(
      (_, index) => !student.material[index]
    );

    missing.textContent = needed.length
      ? "🎒 Flugschule muss mitbringen: " + needed.join(", ")
      : "✅ Alles eigene Material vorhanden!";
  }

  materials.forEach((material, index) => {
    const label = document.createElement("label");
    label.className = "material";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = student.material[index];

    checkbox.onchange = () => {
      student.material[index] = checkbox.checked;
      save();
      updateMissing();
    };

    label.appendChild(checkbox);
    addText(label, "span", material + " – eigenes Material");
    details.appendChild(label);
  });

  details.appendChild(missing);
  updateMissing();

  // BEMERKUNGEN
  addText(details, "h3", "📝 Bemerkungen");

  const notes = document.createElement("textarea");
  notes.rows = 5;
  notes.placeholder = "Hinweise für den nächsten Flug ...";
  notes.value = student.notes || "";

  notes.oninput = () => {
    student.notes = notes.value;
    save();
  };

  details.appendChild(notes);

  addText(details, "p",
    "Bemerkungen werden automatisch im Browser gespeichert."
  ).className = "small";

  details.hidden = false;
}
// SCHULUNGSTAGE SPEICHERN
const trainingDaysKey = "gleitschirm-training-days-v1";

let trainingDays;

try {
  const saved = JSON.parse(localStorage.getItem(trainingDaysKey));
  trainingDays = Array.isArray(saved) ? saved : [];
} catch {
  trainingDays = [];
}

function saveTrainingDays() {
  try {
    localStorage.setItem(
      trainingDaysKey,
      JSON.stringify(trainingDays)
    );
  } catch {
    alert("Schulungstage konnten nicht gespeichert werden.");
  }
}

function renderTrainingDays() {
  const container = $("trainingDays");
  container.replaceChildren();

  const sortedDays = [...trainingDays].sort(
    (a, b) => a.date.localeCompare(b.date)
  );

  sortedDays.forEach(day => {
    const box = document.createElement("div");
    box.className = "maneuver";

    const dateText = new Date(
      day.date + "T12:00:00"
    ).toLocaleDateString("de-CH", {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    });

    addText(box, "strong", "📅 " + dateText);

    
const info = addText(
  box, "p", "Teilnehmer auswählen:"
);
info.className = "small";


const attending = students.filter(
  student => day.participants.includes(student.id)
);

addText(
  box,
  "p",
  "👨‍🎓 " + attending.length + " Schüler angemeldet"
);

// Nur angemeldete Schüler anzeigen
attending.forEach(student => {
  const row = document.createElement("div");
  row.className = "material";

  const nameButton = document.createElement("button");
  nameButton.textContent = "👨‍🎓 " + student.name;
  nameButton.onclick = () => showStudent(student.id);
  row.appendChild(nameButton);

  const removeButton = document.createElement("button");
  removeButton.textContent = "✕";
  removeButton.style.background = "#dc2626";
  removeButton.title = "Vom Schulungstag abmelden";

  removeButton.onclick = () => {
    day.participants = day.participants.filter(
      id => id !== student.id
    );
    saveTrainingDays();
    renderTrainingDays();
  };

  row.appendChild(removeButton);
  box.appendChild(row);
});

// Weitere Schüler nur auf Wunsch anzeigen
const addButton = document.createElement("button");
addButton.textContent = "+ Teilnehmer hinzufügen";
box.appendChild(addButton);

const selection = document.createElement("div");
selection.hidden = true;
box.appendChild(selection);

addButton.onclick = () => {
  selection.hidden = !selection.hidden;
  addButton.textContent = selection.hidden
    ? "+ Teilnehmer hinzufügen"
    : "Auswahl schliessen";
};

students
  .filter(student => !day.participants.includes(student.id))
  .forEach(student => {
    const button = document.createElement("button");
    button.className = "student";
    button.textContent = "+ " + student.name;

    button.onclick = () => {
      day.participants.push(student.id);
      saveTrainingDays();
      renderTrainingDays();
    };

    selection.appendChild(button);
  });



    container.appendChild(box);
  });
}

$("trainingDate").value =
  new Date().toLocaleDateString("en-CA");

$("createTrainingDay").onclick = () => {
  const date = $("trainingDate").value;

  if (!date) {
    alert("Bitte zuerst ein Datum auswählen.");
    return;
  }

  if (trainingDays.some(day => day.date === date)) {
    alert("Für dieses Datum gibt es bereits einen Schulungstag.");
    return;
  }

  trainingDays.push({
    id: crypto.randomUUID(),
    date: date,
    participants: []
  });

  saveTrainingDays();
  renderTrainingDays();
};

renderTrainingDays();
renderStudents();
</script>
</body>
</html>
